plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avicp2023.budgetmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.avicp2023.budgetmanager'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // Signed with the CI debug keystore so the APK is directly installable.
            // Replace with a private release key before publishing to an app store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
