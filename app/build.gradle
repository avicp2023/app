plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    namespace 'com.avicp2023.budgetmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.avicp2023.budgetmanager'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // Signed with the persistent CI key to allow compatible updates.
            // The workflow refuses to publish if its certificate changes.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
