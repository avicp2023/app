name: Build and publish Android APK

on:
  push:
    branches:
      - budget-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: budget-manager

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      # Keep this exact cache key stable across every release.
      - name: Restore persistent APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: budget-manager-debug-keystore-v1

      - name: Ensure persistent debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Build signed APK
        run: |
          gradle --no-daemon clean :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/nihul-taktziv-v1.1.1.apk

      # Fail closed: never publish an APK signed with a different key than
      # the latest known-good release. This protects in-place app updates.
      - name: Verify signature against current release
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          NEW_CERT=$("$SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')
          test -n "$NEW_CERT"
          echo "New APK signing certificate: $NEW_CERT"

          CURRENT_URL="https://github.com/avicp2023/app/releases/download/v1.1.0/nihul-taktziv-v1.1.0.apk"
          CURRENT_APK="/tmp/current-stable.apk"
          if ! curl -fsSL "$CURRENT_URL" -o "$CURRENT_APK"; then
            echo "::error::Cannot download the current stable APK to verify its signing certificate. Refusing to publish."
            exit 1
          fi
          CURRENT_CERT=$("$SIGNER" verify --print-certs "$CURRENT_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')
          echo "Current stable certificate: $CURRENT_CERT"
          if [ "$NEW_CERT" != "$CURRENT_CERT" ]; then
            echo "::error::Signing certificate mismatch with v1.1.0. Refusing to publish an APK that cannot update the current release."
            exit 1
          fi
          echo "Signing certificate matches v1.1.0. Safe to publish."

          # The original 1.0.0 release was signed before a persistent key
          # existed. Keep a visible warning for users upgrading from it.
          LEGACY_URL="https://github.com/avicp2023/app/releases/download/v1.0.0/nihul-taktziv-v1.0.0.apk"
          if curl -fsSL "$LEGACY_URL" -o /tmp/legacy-v1.0.0.apk; then
            LEGACY_CERT=$("$SIGNER" verify --print-certs /tmp/legacy-v1.0.0.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')
            if [ "$LEGACY_CERT" != "$NEW_CERT" ]; then
              echo "::warning::v1.0.0 was signed with a different certificate. Users upgrading from that original build must export a JSON backup, uninstall it, and install the current APK."
            fi
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: budget-manager
          name: ניהול תקציב v1.1.1
          body: |
            גרסה 1.1.1 של אפליקציית ניהול תקציב לאנדרואיד 8 ומעלה.

            - תיקון תהליך החתימה כדי לשמור על תאימות לעדכונים עתידיים
            - בדיקת התאמת חתימה מול הגרסה הקודמת לפני כל פרסום
            - אם מפתח החתימה אינו זמין או שהחתימה השתנתה, הפרסום נעצר

            - ממשק משופר עם כרטיסים מעוגלים וניווט מודגש
            - כל תנועה יכולה להפוך להוראה מחזורית כבר בזמן ההזנה
            - קטגוריות השקעות ורווחי השקעות
            - נעילת אפליקציה באמצעות PIN בן 4 עד 8 ספרות
            - ממשק בעברית ובכיווניות RTL
            - ניהול הכנסות והוצאות, תקציבים וסטטיסטיקות
            - גיבוי מלא וייצוא CSV
            - שמירת נתונים מקומית ללא צורך באינטרנט
          files: dist/nihul-taktziv-v1.1.1.apk
          make_latest: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
