name: Build and publish Android APK

on:
  push:
    branches:
      - budget-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: budget-manager

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Restore persistent APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: budget-manager-debug-keystore-v1

      - name: Ensure persistent debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Build signed APK
        run: |
          gradle --no-daemon clean :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/nihul-taktziv-v1.1.0.apk

      - name: Verify APK signature and compare with prior releases
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          NEW_CERT=$("$SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')
          echo "New APK signing certificate: $NEW_CERT"
          for VERSION in v1.0.0 v1.1.0; do
            OLD_URL="https://github.com/avicp2023/app/releases/download/$VERSION/nihul-taktziv-$VERSION.apk"
            OLD_APK="/tmp/$VERSION.apk"
            if curl -fsSL "$OLD_URL" -o "$OLD_APK"; then
              OLD_CERT=$("$SIGNER" verify --print-certs "$OLD_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')
              if [ "$OLD_CERT" = "$NEW_CERT" ]; then
                echo "$VERSION certificate matches: update signature is compatible."
              else
                echo "::warning::$VERSION uses a different signing certificate; Android may require uninstalling that version before installing this APK."
              fi
            else
              echo "::warning::Could not download $VERSION APK to compare signing certificates."
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: budget-manager
          name: ניהול תקציב v1.1.0
          body: |
            גרסה 1.1.0 של אפליקציית ניהול תקציב לאנדרואיד 8 ומעלה.
            
            - ממשק משופר עם כרטיסים מעוגלים וניווט מודגש
            - כל תנועה יכולה להפוך להוראה מחזורית כבר בזמן ההזנה
            - קטגוריות השקעות ורווחי השקעות
            - נעילת אפליקציה באמצעות PIN בן 4 עד 8 ספרות
            - PIN נשמר כגיבוב PBKDF2 עם salt אקראי ונעילה בחזרה לאפליקציה

            - ממשק בעברית ובכיווניות RTL
            - ניהול הכנסות והוצאות
            - קטגוריות עם אייקונים
            - תקציבים חודשיים ושנתיים
            - הוראות מחזוריות
            - גיבוי מלא וייצוא CSV
            - שמירת נתונים מקומית ללא צורך באינטרנט
          files: dist/nihul-taktziv-v1.1.0.apk
          make_latest: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
